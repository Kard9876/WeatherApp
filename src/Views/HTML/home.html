<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Kard9876">
    <meta name="Description" content="Weather App's Home Page">
    <link rel="stylesheet" href="../CSS/home.css">
    <link rel="icon" href="../Images/favicon.png" type="image/x-icon">
    <title>Home</title>
</head>

<body onload="loadPage()">
    <form class="searchBar" onsubmit="searchCitiesSubmit(event)">
        <div class="textInputsContainer">
            <input type="text" id="cityName" class="searchInput" placeholder="City" onchange="searchCitiesChange()"
                onkeyup="this.onchange();" onpaste="this.onchange();" oninput="this.onchange();">
            <input type="text" id="countryName" class="searchInput" placeholder="Country"
                onchange="searchCitiesChange()" onkeyup="this.onchange();" onpaste="this.onchange();"
                oninput="this.onchange();">
        </div>
        <input type="image" src="../Images/searchIcon.png" class="searchIcon" id="searchIcon">
    </form>

    <div id="searchResultsContainer"></div>

    <script src="../JS/home.js" type="module"></script>
</body>

</html>
